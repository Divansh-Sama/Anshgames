<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhandi Munda</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#071a24;--gold:#f5c542;--yel:#f6d21e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1d6b57 0%,transparent 60%),linear-gradient(#0b2e3a,#071a24);background-attachment:fixed;color:#fff;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none}
.wrap{max-width:460px;margin:0 auto;padding:8px 10px 20px;position:relative}
.top{display:flex;align-items:center;gap:8px;font-size:14px}
.lv{background:var(--gold);color:#000;font-weight:800;border-radius:8px;padding:4px 8px}
.xpb{flex:1;height:14px;background:#0007;border-radius:8px;overflow:hidden;position:relative}
.xpb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f8,#2bd);transition:width .6s}
.xpb span{position:absolute;inset:0;font-size:10px;line-height:14px}
.dia{background:#0007;border-radius:8px;padding:4px 8px;font-weight:700}
.bal{font-size:24px;color:var(--gold);font-weight:800;margin:2px 0 0}
.bal small{display:block;font-size:12px;color:#cfe;font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:8px 0;padding:10px;background:linear-gradient(145deg,#4a2e17,#24150a);border:2px solid #c9a24b;border-radius:18px;box-shadow:inset 0 0 14px #000a,0 6px 16px #0008}
.tile{position:relative;background:linear-gradient(160deg,#ffe56e,#f3bf1a);color:#111;border-radius:12px;padding:5px 2px 30px;border:3px solid #111;cursor:pointer;box-shadow:0 3px 0 #0006}
.tile:active{transform:scale(.96)}
.tile svg{width:100%;height:56px}
.tile b{display:block;font-size:14px}.tile small{font-size:10px}
.bet{position:absolute;top:-8px;right:-4px;background:#c22;color:#fff;border-radius:10px;padding:1px 7px;font-size:12px;font-weight:700;display:none}
.tile.has .bet{display:block}
.tile.win{border-color:#3f6;box-shadow:0 0 16px #3f6}
.tile.lose{opacity:.5}
.chips{display:flex;justify-content:center;gap:12px;margin:6px 0}
.chip{width:50px;height:50px;border-radius:50%;border:3px dashed #fff;background:#a22;color:#fff;font-weight:700;font-size:13px;padding:0}
.chip.sel{background:#2a6;transform:scale(1.12);box-shadow:0 0 10px var(--gold)}
.stage{position:relative;height:230px;margin:2px 0;border-radius:18px;border:3px solid #c9a24b;background:radial-gradient(ellipse at 50% 60%,#25885e,#0c3b2b 75%);box-shadow:inset 0 0 40px #000b,0 6px 16px #0008}
#bk{position:absolute;left:calc(50% - 62px);top:12px;width:124px;cursor:pointer;transform-origin:50% 75%;filter:drop-shadow(0 8px 6px #000a);z-index:2}
.die{position:absolute;bottom:75px;width:var(--ds,80px);height:var(--ds,80px);perspective:500px;z-index:1}
.die::before{content:"";position:absolute;left:6px;right:6px;bottom:-8px;height:14px;border-radius:50%;background:#000a;filter:blur(7px)}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:calc(var(--ds,80px)*.175);background:linear-gradient(145deg,#fff,#d4d4d4);box-shadow:inset 0 0 10px #0004;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}
.face svg{width:calc(var(--ds,80px)*.75);height:calc(var(--ds,80px)*.75)}
.msg{min-height:60px;font-size:15px;font-weight:700;margin:6px 0;line-height:1.3}.res{display:block;font-size:24px;font-weight:900;color:#ffe066}
.row{display:flex;gap:8px}
.btn{flex:1;padding:13px 6px;border:0;border-radius:12px;font-size:16px;font-weight:800}
.go{background:var(--gold);color:#000;flex:1.4}.sec{background:#456;color:#fff}
.btn:disabled{opacity:.4}
.ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
.ov.on{display:flex}
.pan{background:#0f2a33;border:2px solid var(--gold);border-radius:16px;padding:14px;width:100%;max-width:420px;max-height:90vh;overflow:auto;text-align:left}
.pan h3{margin:6px 0;color:var(--gold)}
.it{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:14px}
.it div{flex:1}.it button{padding:8px 10px;border:0;border-radius:8px;background:var(--gold);font-weight:700}
.it button:disabled{opacity:.4}
.pb{height:6px;background:#0008;border-radius:4px;margin-top:3px}.pb i{display:block;height:100%;background:#4f8;border-radius:4px}
.coin{position:fixed;left:0;top:0;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f5c542 55%,#b8860b);border:2px solid #8a6508;box-shadow:0 2px 4px #0008;z-index:20;pointer-events:none}
#house{position:absolute;right:12px;top:48px;background:#0007;border:1px solid #fff4;border-radius:10px;padding:4px 10px;font-size:13px;z-index:1}
.stk{position:absolute;left:50%;bottom:4px;width:26px;margin-left:-13px;height:26px;pointer-events:none}
.stk i{position:absolute;left:0;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a0,#f5c542 55%,#b8860b);border:2px solid #8a6508;box-shadow:0 1px 2px #0008;font:700 9px/22px system-ui;font-style:normal;text-align:center;color:#000}
#bar{position:sticky;bottom:0;padding:8px 0 4px;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
.btn{transition:transform .12s,filter .2s,box-shadow .2s;box-shadow:0 3px 0 #0006}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn:not(:disabled):hover{filter:brightness(1.08)}
.go{background:linear-gradient(180deg,#ffe27a,#f0b323)}
.sec{background:linear-gradient(180deg,#5b7185,#3b4c5d)}
.tile{transition:transform .15s,box-shadow .2s;box-shadow:0 3px 0 #0006,inset 0 1px 0 #fff9}
.tile:hover{transform:translateY(-2px)}
.tile.pop{animation:pop .26s}
@keyframes pop{50%{transform:scale(1.06)}}
.chip{transition:transform .15s,box-shadow .2s,background .2s;background:radial-gradient(circle at 35% 30%,#e55,#a22 70%);box-shadow:0 3px 0 #0006}
.chip.sel{background:radial-gradient(circle at 35% 30%,#4d9,#2a6 70%);transform:scale(1.12);box-shadow:0 0 12px var(--gold)}
.chip.sp{background:radial-gradient(circle at 35% 30%,#fff3a0,#e0a800 70%);color:#000;border-color:#fff;animation:glow 1.6s infinite}
.chip.sp.sel{background:radial-gradient(circle at 35% 30%,#fff3a0,#e0a800 70%)}
@keyframes glow{50%{box-shadow:0 0 16px 3px #ffd84a}}
#low{display:none;align-items:center;justify-content:center;gap:8px;font-size:12px;color:#ffe066;margin:2px 0 6px}
#low button{padding:6px 10px;border:0;border-radius:8px;font-weight:800;font-size:12px;background:linear-gradient(180deg,#ffe27a,#f0b323)}
.ov.on{animation:fin .25s}.ov.on .pan{animation:pin .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fin{from{opacity:0}}@keyframes pin{from{opacity:0;transform:scale(.9) translateY(10px)}}
.tw{position:fixed;left:0;right:0;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:30;pointer-events:none}
.tst{background:linear-gradient(180deg,#1f6b4a,#0f3d2b);border:2px solid var(--gold);color:#fff;border-radius:14px;padding:9px 16px;font-size:14px;font-weight:700;box-shadow:0 6px 18px #000a;max-width:92%;animation:tin .45s cubic-bezier(.2,.9,.3,1.15) both}
.tst small{display:block;color:#ffe066;font-size:13px}
.tst.out{animation:tout .4s ease-in forwards}
@keyframes tin{from{transform:translateY(140%);opacity:0}}
@keyframes tout{to{transform:translateY(140%);opacity:0}}
.mb{background:#0007;border:0;border-radius:8px;padding:4px 6px;font-size:14px;color:#fff}.mb.off{opacity:.4}
#auth{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto;background:radial-gradient(ellipse at 50% -10%,#1d6b57,transparent 60%),linear-gradient(#0b2e3a,#071a24)}
#auth.on{display:flex}
.ab{width:100%;max-width:380px;text-align:center;margin:auto}
.ab h1{margin:0;font-size:36px;color:var(--gold);line-height:1.1}
.ab .dc{font-size:54px;filter:drop-shadow(0 6px 6px #000a)}
.ab p{color:#cfe;font-size:14px;margin:6px 0 18px}
.ab .btn{display:block;width:100%;flex:none;margin:8px 0}
.ab .ggl{background:#fff;color:#222}
.ab input,.ab textarea{width:100%;padding:13px;margin:5px 0;border-radius:10px;border:2px solid #c9a24b66;background:#0008;color:#fff;font-size:16px;font-family:inherit;-webkit-user-select:text;user-select:text}
.ab textarea{height:110px;resize:none;font-size:12px}
.er{color:#ff9a9a;font-size:13px;min-height:20px;margin:4px 0}.ok{color:#8f8}
.lk2{background:none;border:0;color:#9fd;text-decoration:underline;font-size:14px;padding:10px}
#m textarea{width:100%;height:90px;font-size:11px;background:#0008;color:#fff;border:1px solid #c9a24b66;border-radius:8px;-webkit-user-select:text;user-select:text}

#mode{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;padding:14px;overflow:auto;background:radial-gradient(ellipse at 50% -10%,#1d6b57,transparent 60%),linear-gradient(#0b2e3a,#071a24)}
#mode.on{display:flex;animation:fin .25s}
.mf{width:100%;max-width:420px;margin:auto;padding:18px 12px 14px;background:linear-gradient(145deg,#4a2e17,#24150a);border:3px solid #c9a24b;border-radius:24px;box-shadow:inset 0 0 14px #000a,0 8px 22px #000a}
.mf h1{margin:0;font-size:28px;color:var(--gold)}
.mf p{color:#cfe;font-size:14px;margin:4px 0 16px}
.mrow{display:flex;flex-direction:column;gap:14px}
.mc{width:100%;height:150px;display:flex;flex-direction:row;align-items:center;gap:12px;text-align:left;font-family:inherit;background:linear-gradient(160deg,#ffe56e,#f3bf1a);color:#111;border:3px solid #111;border-radius:16px;padding:14px 6px 12px;box-shadow:0 4px 0 #0006,inset 0 1px 0 #fff9;cursor:pointer;transition:transform .15s}
.mc.m6{background:linear-gradient(160deg,#f6e3a1,#c9962b)}
.mc:hover{transform:translateY(-3px)}.mc:active{transform:translateY(2px)}
.mc .vis{flex:none;width:138px;display:flex;align-items:center;justify-content:center}
.mc .tx{flex:1;min-width:0}
.mc b{display:block;font-size:30px;letter-spacing:1px}
.mc small{display:block;font-size:12px;margin-top:4px;line-height:1.4;font-weight:700}
.md{display:inline-block;width:44px;height:44px;border-radius:9px;background:linear-gradient(145deg,#fff,#d4d4d4);box-shadow:inset 0 0 6px #0004,0 3px 0 #0006;padding:5px;border:1px solid #0003}
.md svg{width:100%;height:100%;display:block}
.d3{display:flex;justify-content:center;gap:6px}
.d3 .md{width:40px;height:40px;padding:4px}
.d3 .md:nth-child(1){transform:rotate(-8deg)}.d3 .md:nth-child(2){transform:rotate(7deg)}.d3 .md:nth-child(3){transform:rotate(-3deg)}
.d6{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:126px;margin:0 auto}
.d6 .md{width:36px;height:36px;padding:4px;border-radius:8px}
.d6 .md:nth-child(odd){transform:rotate(-6deg)}.d6 .md:nth-child(even){transform:rotate(6deg)}
.pt{font-size:11px;color:#cfe;margin:4px 0 0;line-height:1.35}

/* 6-dice premium theme: midnight violet + gold, wine velvet mat */
body.m6{--bg:#10061c;background:radial-gradient(ellipse at 50% -10%,#6b2fa0 0%,transparent 62%),radial-gradient(ellipse at 50% 110%,#3a1250 0%,transparent 60%),linear-gradient(#1b0a31,#08030f);background-attachment:fixed}
body.m6 .grid{background:linear-gradient(145deg,#2b1646,#120720);border-color:#e8c76a;box-shadow:inset 0 0 18px #000b,0 0 0 1px #8a6a1e,0 8px 22px #0009,0 0 22px #7a3fc033}
body.m6 .stage{border-color:#e8c76a;background:radial-gradient(ellipse at 50% 55%,#7a1f45 0%,#4a1130 55%,#220816 90%);box-shadow:inset 0 0 44px #000c,0 0 0 1px #8a6a1e,0 8px 22px #0009,0 0 22px #7a3fc033}
body.m6 .lv,body.m6 .go{background:linear-gradient(180deg,#fff0a8,#e0a91c)}
body.m6 .bal{text-shadow:0 0 14px #e8c76a66}
body.m6 .pt{color:#f1dd9a}
body.m6 .dia,body.m6 .mb,body.m6 .xpb{background:#1b0a3199;box-shadow:inset 0 0 0 1px #e8c76a44}
/* layout 2: stage (bucket + rolling) on top, mat below, everything fits one screen */
body.l2 .wrap{display:flex;flex-direction:column;height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:560px;padding-bottom:0}
body.l2 .top{order:0;flex:none}body.l2 .bal{order:1;flex:none;font-size:22px;margin:0}body.l2 .bal small{font-size:11px}
body.l2 .stage{order:2;flex:1 1 0;min-height:196px;max-height:460px;height:auto;margin:2px 0}
body.l2 .grid{order:3;flex:none;margin:6px 0 4px;padding:7px;gap:6px}
body.l2 .tile{padding:3px 2px 28px}body.l2 .tile svg{height:44px}body.l2 .tile b{font-size:13px}
body.l2 .chips{order:4;flex:none;margin:4px 0;gap:10px}body.l2 .chip{width:46px;height:46px}
body.l2 #low{order:5;flex:none}
body.l2 .msg{order:6;flex:none;min-height:0;margin:2px 0;font-size:14px;line-height:1.25;max-height:54px;overflow:hidden}body.l2 .msg .res{font-size:19px}
body.l2 #bar{order:8;flex:none;padding:4px 0}body.l2 .btn{padding:11px 6px}
@media (max-height:700px){body.l2 .stage{min-height:176px}body.l2 .tile svg{height:34px}body.l2 .tile{padding-bottom:25px}body.l2 .grid{margin:4px 0 2px}body.l2 .chip{width:42px;height:42px}body.l2 .chips{margin:2px 0}body.l2 .msg{font-size:13px;max-height:44px}body.l2 .msg .res{font-size:16px}body.l2 .btn{padding:9px 6px;font-size:15px}}
.top{gap:4px}.mb{flex:none;padding:4px 5px}
.sl{width:100%;accent-color:#f5c542;height:28px}
.vr{display:flex;align-items:center;gap:8px;font-size:20px}
.vr span{width:42px;text-align:right;font-size:14px;font-weight:800;color:var(--gold)}
.uis{display:flex;gap:10px;margin-top:6px}
.ui{flex:1;font-family:inherit;color:#fff;background:#0008;border:2px solid #c9a24b55;border-radius:12px;padding:8px 6px;font-size:13px;font-weight:800}
.ui.sel{border-color:var(--gold);box-shadow:0 0 12px #f5c54277;background:#2a3d2f}
.ui svg{width:70px;height:96px;display:block;margin:0 auto 6px}
.pan .hint{font-size:12px;color:#9cb;margin-top:8px}
</style></head><body>

  <h3 style="font-size:15px;margin-top:12px">🎲 6 Dice${cur(6)}</h3>${row("1 dice matches","No win")}${row("2 dice match","2x")}${row("3 dice match","3x")}${row("4 dice match","4x")}${row("5 dice match","5x")}${row("6 dice match","6x")}`;
 $("m").classList.add("on")}
$("bi").onclick=openInfo;

/* ===== Accounts / login =====
 CFG.API_URL: optional backend for real cross-device sync (endpoints POST /register /login /google /save).
 CFG.GOOGLE_CLIENT_ID: Google OAuth web client ID for "Google Play Games / Google" sign-in.
 Without them, accounts work on this device and move between devices with a Sync Code. */
const CFG={API_URL:"",GOOGLE_CLIENT_ID:""};
const LS=localStorage,J=(k,d)=>{try{return JSON.parse(LS.getItem(k))||d}catch(e){return d}};
const err=(m,ok)=>{const e=$("er");if(e){e.textContent=m;e.className="er"+(ok?" ok":"")}};
async function api(path,body){const r=await fetch(CFG.API_URL+path,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Server error");return d}
let cpT=0;function cloudPush(){if(!CFG.API_URL||!SES||!SES.token)return;clearTimeout(cpT);cpT=setTimeout(()=>api("/save",{token:SES.token,data:{...S,bal:S.bal+tot()}}).catch(()=>{}),2500)}
async function hp(p,salt){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of salt+p)h=(h*33^c.charCodeAt(0))>>>0;return"f"+h}}
function loadAcct(){clearTimeout(lt);lt=0;S=JSON.parse(DEF);try{Object.assign(S,JSON.parse(LS.getItem(SKEY())))}catch(e){}
 if(!S.tk||S.tk.length!==4||S.tv!==5){S.tv=5;S.tc=S.tc||0;S.tk=newTasks()}
 bets=bets.map(()=>0);betsC=betsC.map(()=>[]);chip=100;shown=S.bal;$("bal").textContent=shown;hideLock();render()}
function start(ses){SES=ses;LS.setItem("jm_ses",JSON.stringify(ses));loadAcct();$("auth").classList.remove("on");showModes();say(`Welcome, ${ses.name.replace(/</g,"&lt;")}! Pick a chip, tap pictures to bet, then tap the bucket (or ROLL).`);cloudPush()}
function mergeIn(id,d){const o=J("jm2:"+id,null);if(!o||(d.rolls||0)>=(o.rolls||0))LS.setItem("jm2:"+id,JSON.stringify(d))}
async function doLogin(idf,pw){idf=(idf||"").trim();if(!idf||!pw)throw new Error("Enter your username or mobile number and password");
 const mob=/^\+?[\d\s-]{7,16}$/.test(idf)?idf.replace(/\D/g,""):null,U=J("jm_users",{});
 if(CFG.API_URL){const r=await api("/login",{id:mob||idf.toLowerCase(),password:pw});if(r.data)mergeIn(r.id,r.data);return start({id:r.id,name:r.name,type:"acct",token:r.token})}
 const u=Object.values(U).find(x=>mob?x.mobile===mob:x.name.toLowerCase()===idf.toLowerCase());
 if(!u||await hp(pw,u.salt)!==u.hash)throw new Error("Wrong username/mobile or password");
 start({id:u.id,name:u.name,type:"acct"})}
async function doSignup(n,m,p,p2,carry){n=(n||"").trim();m=(m||"").replace(/\D/g,"");
 if(!/^[\w.]{3,16}$/.test(n))throw new Error("Username: 3-16 letters, numbers, . or _");
 if(m&&(m.length<7||m.length>15))throw new Error("Enter a valid mobile number");
 if(p.length<6)throw new Error("Password must be at least 6 characters");
 if(p!==p2)throw new Error("Passwords don't match");
 const data={...S,bal:S.bal+tot()};
 if(CFG.API_URL){const r=await api("/register",{name:n,mobile:m,password:p,data:carry?data:undefined});if(carry)LS.setItem("jm2:"+r.id,JSON.stringify(data));return start({id:r.id,name:r.name||n,type:"acct",token:r.token})}
 const U=J("jm_users",{}),V=Object.values(U);
 if(V.some(x=>x.name.toLowerCase()===n.toLowerCase()))throw new Error("That username is already taken");
 if(m&&V.some(x=>x.mobile===m))throw new Error("That mobile number is already registered");
 const id="u"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),salt=Math.random().toString(36).slice(2);
 U[id]={id,name:n,mobile:m,salt,hash:await hp(p,salt)};LS.setItem("jm_users",JSON.stringify(U));
 if(carry)LS.setItem("jm2:"+id,JSON.stringify(data));
 start({id,name:n,type:"acct"})}
function guest(){start({id:"guest",name:"Guest",type:"guest"})}
function googleIn(){
 if(window.JMNative&&JMNative.playGamesSignIn){JMNative.playGamesSignIn();return}
 if(!CFG.GOOGLE_CLIENT_ID)return err("Google sign-in isn't set up yet. Add your Google Client ID in CFG (see the code comment).");
 const go=()=>{google.accounts.id.initialize({client_id:CFG.GOOGLE_CLIENT_ID,callback:async r=>{try{
  if(CFG.API_URL){const d=await api("/google",{credential:r.credential});if(d.data)mergeIn(d.id,d.data);return start({id:d.id,name:d.name,type:"google",token:d.token})}
  const q=JSON.parse(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));start({id:"g"+q.sub,name:q.given_name||q.name||"Player",type:"google"})}catch(e){err(e.message||"Google sign-in failed")}}});google.accounts.id.prompt()};
 if(window.google&&google.accounts)go();else{const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=go;s.onerror=()=>err("Couldn't reach Google. Check your connection.");document.head.appendChild(s)}}
window.onPlayGamesResult=r=>{if(r&&r.id)start({id:"g"+r.id,name:r.name||"Player",type:"google"});else err("Google Play Games sign-in was cancelled")};
const mkCode=()=>{const u=SES.type==="acct"?J("jm_users",{})[SES.id]:null;return btoa(unescape(encodeURIComponent(JSON.stringify({s:{id:SES.id,name:SES.name,type:SES.type},u,d:{...S,bal:S.bal+tot()}}))))};
function importCode(c){let o;try{o=JSON.parse(decodeURIComponent(escape(atob((c||"").trim()))))}catch(e){throw new Error("That sync code isn't valid")}
 if(!o||!o.s||!o.d)throw new Error("That sync code isn't valid");
 if(o.u){const U=J("jm_users",{});U[o.u.id]=o.u;LS.setItem("jm_users",JSON.stringify(U))}
 LS.setItem(o.s.type==="guest"?"jm2":"jm2:"+o.s.id,JSON.stringify(o.d));
 if(o.u)return authView("login","Restored! Log in as "+o.u.name+" with your password.");start(o.s)}
async function run(fn){const b=$("ab").querySelector(".go");if(b)b.disabled=true;try{await fn()}catch(e){err(e.message||"Something went wrong")}if(b)b.disabled=false}
const V=id=>$(id).value;
function authView(v,msg,carry){const a=$("ab");$("auth").classList.add("on");const bk=`<button class="lk2" onclick="authView('home')">← Back</button>`;
 const hd=`<div class="dc">🎲</div><h1>Jhandi Munda</h1>`;
 if(v==="home")a.innerHTML=`${hd}<p>Sign in to keep your progress and play on any device</p>
  <button class="btn go" onclick="authView('login')">Login</button>
  <button class="btn sec" onclick="authView('signup')">Sign up</button>
  <button class="btn ggl" onclick="googleIn()">🎮 Google Play Games</button>
  <button class="btn sec" onclick="guest()">Play as Guest</button>
  <div class="er" id="er"></div><button class="lk2" onclick="authView('restore')">Restore from sync code</button>`;
 else if(v==="login")a.innerHTML=`${hd}<p>Welcome back</p>
  <input id="a1" placeholder="Username or mobile number" autocomplete="username" autocapitalize="none">
  <input id="a2" type="password" placeholder="Password" autocomplete="current-password">
  <div class="er" id="er"></div><button class="btn go" onclick="run(()=>doLogin(V('a1'),V('a2')))">Login</button>
  <button class="lk2" onclick="authView('signup')">New here? Create an account</button>${bk}`;
 else if(v==="signup")a.innerHTML=`${hd}<p>${carry?"Create an account to keep your current progress":"Create your account"}</p>
  <input id="a1" placeholder="Username" autocomplete="username" autocapitalize="none">
  <input id="a3" type="tel" placeholder="Mobile number (optional)" autocomplete="tel">
  <input id="a2" type="password" placeholder="Password (6+ characters)" autocomplete="new-password">
  <input id="a4" type="password" placeholder="Confirm password" autocomplete="new-password">
  <div class="er" id="er"></div><button class="btn go" onclick="run(()=>doSignup(V('a1'),V('a3'),V('a2'),V('a4'),${carry?1:0}))">Sign up &amp; play</button>
  <button class="lk2" onclick="authView('login')">Already have an account? Login</button>${carry?`<button class="lk2" onclick="$('auth').classList.remove('on')">Cancel</button>`:bk}`;
 else a.innerHTML=`${hd}<p>Paste the sync code from your other device</p><textarea id="a1" placeholder="Sync code"></textarea>
  <div class="er" id="er"></div><button class="btn go" onclick="run(async()=>importCode(V('a1')))">Restore</button>${bk}`;
 if(msg)err(msg,1)}
function openProfile(){if(busy)return;const t={guest:"Guest (progress saved on this device only)",acct:"Account",google:"Google Play Games"}[SES.type];
 $("mb").innerHTML=`<h3>👤 ${SES.name.replace(/</g,"&lt;")}</h3><div style="font-size:13px;color:#cfe;margin-bottom:8px">${t}</div>
  ${SES.type==="guest"?`<button class="btn go" style="width:100%;margin:4px 0" onclick="$('m').classList.remove('on');authView('signup','',1)">Create account &amp; keep progress</button>`:""}
  <div style="font-size:13px;margin:10px 0 4px">Move to another device: copy this sync code, then choose “Restore from sync code” there.</div>
  <textarea id="sc" readonly>${mkCode()}</textarea>
  <button class="btn sec" style="width:100%;margin:6px 0" onclick="cpCode()">Copy sync code</button>
  <button class="btn sec" style="width:100%;margin:4px 0" onclick="logout()">Log out / switch account</button>`;$("m").classList.add("on")}
window.cpCode=()=>{const t=$("sc");t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand("copy")}};
window.logout=()=>{if(busy)return;render();clearTimeout(cpT);if(CFG.API_URL&&SES.token)api("/save",{token:SES.token,data:{...S,bal:S.bal+tot()}}).catch(()=>{});
 SES=null;LS.removeItem("jm_ses");$("m").classList.remove("on");loadAcct();authView("home")};
$("bp").onclick=openProfile;
$("bal").textContent=shown;render();
if(!SES)authView("home");else showModes();
</script></body></html>
