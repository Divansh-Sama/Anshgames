<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Ansh Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            color: #ffffff;
        }

        /* Background Graphic Canvas */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Overlay Layout */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            text-align: center;
            background: radial-gradient(circle, rgba(0,0,0,0.3) 0%, rgba(11,14,20,0.85) 100%);
        }

        .hero-section {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 3rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 230, 153, 0.6);
            margin-bottom: 2rem;
            color: #ffffff;
        }

        .play-btn {
            display: inline-block;
            padding: 1.2rem 3.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(0, 114, 255, 0.6);
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(0, 198, 255, 0.9);
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
        }

        /* Footer Description Section */
        .footer-info {
            max-width: 600px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #a0aec0;
            background: rgba(22, 27, 34, 0.75);
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .footer-info p {
            margin-bottom: 0.4rem;
        }

        .footer-info a {
            color: #00c6ff;
            text-decoration: none;
            word-break: break-all;
        }

        .footer-info a:hover {
            text-decoration: underline;
        }
