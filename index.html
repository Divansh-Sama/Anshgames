<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Ansh Games</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0e14;
            color: #ffffff;
        }

        /* Dark Gaming Background Graphics */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Screen Layout */
        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 1rem;
            text-align: center;
            background: radial-gradient(circle, rgba(0,0,0,0.2) 0%, rgba(11,14,20,0.85) 100%);
        }

        .hero-section {
            margin: auto 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 20px rgba(0, 230, 153, 0.6);
            margin-bottom: 2.5rem;
            color: #ffffff;
        }

        /* Play Now Button */
        .play-btn {
            display: inline-block;
            padding: 1.2rem 3.5rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 0 25px rgba(0, 114, 255, 0.6);
            transition: all 0.3s ease;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .play-btn:hover {
            transform: scale(1.08);
            box-shadow: 0 0 35px rgba(0, 198, 255, 0.9);
            background: linear-gradient(135deg, #0072ff 0%, #00c6ff 100%);
        }

        /* Description Section */
        .description {
            max-width: 600px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #d0d7de;
            background: rgba(22, 27, 34, 0.8);
            padding: 1.2rem 1.5rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        .description p {
            margin-bottom: 0.4rem;
        }

        /* Highlight Name Styling */
        .highlight-name {
            color: #00e699;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0, 230, 153, 0.4);
        }

        .description a {
            color: #00c6ff;
            text-decoration: none;
            word-break: break-all;
        }

        .description a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
            }
            .play-btn {
                padding: 1rem 2.5rem;
                font-size: 1.2rem;
            }
            .description {
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <!-- Gaming Graphic Background -->
    <canvas id="bg-canvas"></canvas>

    <div class="container">
        <!-- Main Content -->
        <div class="hero-section">
            <h1>Welcome to Ansh Games</h1>
            <a href="Ansh_Games-Premium.html" class="play-btn">Play Now</a>
        </div>

        <!-- Description -->
        <div class="description">
            <p>Thanks for Visiting our Site</p>
            <p>Created and Produced by <span class="highlight-name">Divansh Sama</span></p>
            <p>Games are created after many errors and trials, it took a lot of work..</p>
            <p>If you have recommendations</p>
            <p>Contact <span class="highlight-name">Divansh Sama</span></p>
            <p>Through - <a href="mailto:anshsama000@gmail.com">anshsama000@gmail.com</a></p>
        </div>
    </div>

    <!-- Dynamic Graphics Animation -->
    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        const particles = [];
        const shapes = ['square', 'circle', 'triangle'];

        for (let i = 0; i < 35; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                size: Math.random() * 20 + 10,
                speedX: (Math.random() - 0.5) * 1.2,
                speedY: (Math.random() - 0.5) * 1.2,
                shape: shapes[Math.floor(Math.random() * shapes.length)],
                color: `rgba(${Math.floor(Math.random() * 100)}, ${Math.floor(Math.random() * 200 + 55)}, 255, ${Math.random() * 0.25 + 0.1})`
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.x += p.speedX;
                p.y += p.speedY;

                if (p.x < 0 || p.x > canvas.width) p.speedX *= -1;
                if (p.y < 0 || p.y > canvas.height) p.speedY *= -1;

                ctx.fillStyle = p.color;
                ctx.beginPath();
                if (p.shape === 'circle') {
                    ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                } else if (p.shape === 'square') {
                    ctx.rect(p.x, p.y, p.size, p.size);
                } else if (p.shape === 'triangle') {
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x + p.size, p.y + p.size);
                    ctx.lineTo(p.x - p.size, p.y + p.size);
                }
                ctx.closePath();
                ctx.fill();
            });

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
